services:
  postgres:
    image: postgres:16-alpine
    container_name: edulink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edulink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - edulink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edulink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edulink_pgdata:
